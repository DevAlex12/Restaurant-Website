<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu — Papilz Foods</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="menu.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d2c26" />
    <link rel="icon" href="icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Papilz" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <nav class="menu-nav">
      <a href="index.html" class="wordmark-dark"><img src="images/papilz-badge.png" alt="" class="wordmark-badge" />Papilz<span class="wordmark-accent">.</span></a>
      <div class="menu-nav-actions">
        <a href="shorts.html" class="shorts-pill" aria-label="Watch Food Shorts">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 2.8v10.4l9-5.2-9-5.2Z" fill="currentColor"/>
          </svg>
        </a>
        <a href="cart.html" class="cart-pill" aria-label="View cart">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M2 3h2l1.6 9.6a2 2 0 0 0 2 1.7h6.8a2 2 0 0 0 2-1.6L18 6.5H5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="17.5" r="1.3" fill="currentColor"/>
            <circle cx="14.5" cy="17.5" r="1.3" fill="currentColor"/>
          </svg>
          <span class="cart-count" id="cartCount" hidden>0</span>
        </a>
      </div>
    </nav>

    <header class="menu-header">
      <h1>Our menu</h1>
      <p>Pick a meal, make it yours — add extra scoops, protein or sides right where you order.</p>
    </header>

    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search the menu…" autocomplete="off" />
      </div>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <main class="foods" id="foods"></main>
    <p class="empty-state" id="emptyState" hidden>Nothing matches that search — try another word.</p>

    <!-- ===== ORDER BUILDER SHEET ===== -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="builder-sheet" id="builderSheet" role="dialog" aria-modal="true" aria-labelledby="builderTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>

      <div class="sheet-scroll">
        <div class="sheet-head">
          <img id="builderImg" src="" alt="" class="sheet-img" />
          <div>
            <h2 id="builderTitle"></h2>
            <span class="sheet-base-price" id="builderBasePrice"></span>
          </div>
        </div>

        <div id="addonGroups"></div>
      </div>

      <div class="sheet-footer">
        <div class="sheet-qty">
          <button class="stepbtn" id="builderMinus" aria-label="Decrease quantity">−</button>
          <span id="builderQty">1</span>
          <button class="stepbtn" id="builderPlus" aria-label="Increase quantity">+</button>
        </div>
        <button class="sheet-add" id="builderAdd">
          Add to cart · <span id="builderTotal">₦0</span>
        </button>
      </div>
    </div>

    <div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

    <script src="menu.js"></script>
    <script src="pwa.js"></script>
    <script src="engagement.js"></script>
  </body>
</html>
