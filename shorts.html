<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Food Shorts — Papilz Foods</title>
    <meta
      name="description"
      content="Quick, mouth-watering clips from the Papilz kitchen — plating, sizzling, the whole vibe."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="shorts.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d2c26" />
    <link rel="icon" href="icons/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Papilz" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="shorts-page">
    <nav class="shorts-topnav">
      <a href="index.html" class="shorts-back" aria-label="Back to home">
        <svg
          width="18"
          height="18"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M12.5 4.5L6 10l6.5 5.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
      <span class="shorts-title">Food Shorts</span>
      <a href="menu.html" class="shorts-menu-link">Menu</a>
    </nav>

    <main class="shorts-feed" id="shortsFeed" aria-label="Papilz Food Shorts">
      <!-- Cards injected by shorts.js -->
    </main>

    <template id="shortCardTemplate">
      <section class="short-card">
        <video
          class="short-video"
          loop
          muted
          playsinline
          preload="metadata"
        ></video>
        <button type="button" class="short-mute" aria-label="Toggle sound">
          <svg
            class="icon-muted"
            width="18"
            height="18"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
          >
            <path d="M3 8v4h3.2L11 15.5v-11L6.2 8H3Z" fill="currentColor" />
            <path
              d="M14 7l4 6M18 7l-4 6"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <svg
            class="icon-sound"
            width="18"
            height="18"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
            hidden
          >
            <path d="M3 8v4h3.2L11 15.5v-11L6.2 8H3Z" fill="currentColor" />
            <path
              d="M14 7.5c1.1.9 1.1 4.1 0 5M16.2 5.8c2.2 1.9 2.2 6.5 0 8.4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="short-scrim"></div>
        <div class="short-info">
          <span class="short-eyebrow">Papilz Foods</span>
          <h2 class="short-caption"></h2>
          <div class="short-actions">
            <a class="short-cta short-cta-menu" href="menu.html">
              Check out the menu
              <svg
                width="14"
                height="14"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M3 8h10M9 4l4 4-4 4"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <button type="button" class="short-cta short-cta-install">
              Install the app
              <svg
                width="14"
                height="14"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M8 2v8m0 0l-3-3m3 3l3-3M3 13h10"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </template>

    <div class="toast" id="shortsToast">
      <span class="dot"></span><span id="shortsToastText"></span>
    </div>

    <script src="pwa.js"></script>
    <script src="shorts.js"></script>
  </body>
</html>
